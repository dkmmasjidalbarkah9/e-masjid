    // =========================================================================

    // =========================================================================
    function formatRupiah(num) {
      const val = Number(num) || 0;
      return 'Rp ' + val.toLocaleString('id-ID');
    }

    function formatTanggal(isoDate) {
      if (!isoDate) return '-';
      const parts = isoDate.split('-');
      if (parts.length !== 3) return isoDate;
      const bulan = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
      return `${parts[2]} ${bulan[parseInt(parts[1], 10) - 1] || parts[1]} ${parts[0]}`;
    }

    function getRoleLabel(role) {
      const map = {
        superadmin: 'Admin Utama',
        bendahara: 'Bendahara DKM',
        ketua_dkm: 'Ketua DKM',
        sekretaris: 'Sekretaris DKM'
      };
      return map[role] || role;
    }

      return {

        canManageUsers: role === 'superadmin' || role === 'sekretaris' || role === 'ketua_dkm',

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const colors = {
        success: 'bg-gray-900 text-white border-emerald-500',
        error: 'bg-rose-600 text-white border-rose-400',
        info: 'bg-brand-600 text-white border-brand-400'
      };
      const el = document.createElement('div');
      el.className = `pointer-events-auto px-4 py-3 rounded-2xl shadow-xl border-l-4 text-xs sm:text-sm font-semibold flex items-center justify-between gap-3 transition-all duration-300 ${colors[type] || colors.success}`;
      el.innerHTML = `<span>${message}</span>`;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(-8px)';
        setTimeout(() => el.remove(), 300);
      }, 3200);
    }

    function openModal(htmlContent, maxWidthClass = 'max-w-lg') {
      const modal = document.getElementById('modal-container');
      if (!modal) return;
      modal.innerHTML = `
        <div class="bg-white w-full ${maxWidthClass} rounded-3xl shadow-2xl border border-gray-100 overflow-hidden my-auto animate-fade-in">
          ${htmlContent}
        </div>
      `;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      if (window.lucide) lucide.createIcons();
    }

    function closeModal() {
      const modal = document.getElementById('modal-container');
      if (!modal) return;
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      modal.innerHTML = '';
    }

    // Kompresi gambar kamera/galeri agar ringan di Firestore (< 1MB)
    function compressImageFile(file, maxDim = 800, quality = 0.72) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width;
            let h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) {
                h = Math.round((h * maxDim) / w);
                w = maxDim;
              } else {
                w = Math.round((w * maxDim) / h);
                h = maxDim;
              }
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // =========================================================================
    // 6. SINKRONISASI REAL-TIME FIRESTORE (HANYA SAAT IS_PREVIEW === false)
    // =========================================================================
    function stopRealtimeListeners() {
      unsubscribers.forEach(unsub => { try { unsub(); } catch (e) {} });
      unsubscribers = [];
    }

    async function startRealtimeSync() {
      if (IS_PREVIEW || !fbDb) return;
      stopRealtimeListeners();

      // 1. Settings Masjid
      const unsubSettings = onSnapshot(doc(fbDb, 'masjid_settings', 'profil_utama'), (snap) => {
        if (snap.exists()) {
          state.settings = { ...state.settings, ...snap.data() };
          renderApp();
        }
      }, (err) => console.error('Settings sync error:', err));

      // 2. Pengurus DKM
      const unsubUsers = onSnapshot(collection(fbDb, 'masjid_users'), (snap) => {
        state.users = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderApp();
      }, (err) => console.error('Users sync error:', err));

      // 3. Kategori Keuangan
      const unsubCats = onSnapshot(collection(fbDb, 'masjid_categories'), (snap) => {
        state.categories = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderApp();
      }, (err) => console.error('Categories sync error:', err));

      // 4. Transaksi Keuangan
      const unsubTrx = onSnapshot(collection(fbDb, 'masjid_transactions'), (snap) => {
        const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        list.sort((a, b) => (b.tanggal || '').localeCompare(a.tanggal || ''));
        state.transactions = list;
        renderApp();
      }, (err) => console.error('Transactions sync error:', err));

      unsubscribers.push(unsubSettings, unsubUsers, unsubCats, unsubTrx);
    }

    // =========================================================================
    // 7. OPERASI CRUD DATA (DUAL-MODE: IN-MEMORY PREVIEW vs FIRESTORE LIVE)
    // =========================================================================
    async function saveTransaction(payload, editId = null) {
      const data = {
        ...payload,
        dibuat_oleh: state.currentUser?.nama || 'Pengurus',
        role_pembuat: state.currentUser?.role || 'bendahara',
        updated_at: new Date().toISOString()
      };

      if (IS_PREVIEW) {
        if (editId) {
          const idx = state.transactions.findIndex(t => t.id === editId);
          if (idx !== -1) state.transactions[idx] = { ...state.transactions[idx], ...data };
          showToast('Transaksi berhasil diperbarui.');
        } else {
          state.transactions.unshift({ id: 'trx-' + Date.now(), ...data });
          showToast('Transaksi baru berhasil dicatat.');
        }
        state.transactions.sort((a, b) => (b.tanggal || '').localeCompare(a.tanggal || ''));
        closeModal();
        renderApp();
        return;
      }

      try {
        if (editId) {
          await updateDoc(doc(fbDb, 'masjid_transactions', editId), data);
          showToast('Transaksi berhasil diperbarui di database.');
        } else {
          await addDoc(collection(fbDb, 'masjid_transactions'), data);
          showToast('Transaksi baru tersimpan ke database.');
        }
        closeModal();
      } catch (err) {
        showToast('Gagal menyimpan transaksi: ' + err.message, 'error');
      }
    }

    async function handleUnifiedLogin(identifier, password) {
      const cleanId = (identifier || '').trim();
      if (!cleanId || !password) {
        showToast('Email / Username dan password wajib diisi.', 'error');
        return;
      }

      const isEmailLogin = cleanId.includes('@');

      if (IS_PREVIEW) {

    // =========================================================================
    // 9. KALKULASI STATISTIK DASHBOARD & FILTER LAPORAN
    // =========================================================================
    function getDashboardStats() {
      let totalMasuk = 0;
      let totalKeluar = 0;
      let bulanIniMasuk = 0;
      let bulanIniKeluar = 0;
      const currentMonthPrefix = new Date().toISOString().slice(0, 7);

      state.transactions.forEach(t => {
        const nom = Number(t.nominal) || 0;
        const isCurrentMonth = (t.tanggal || '').startsWith(currentMonthPrefix);
        if (t.jenis === 'pemasukan') {
          totalMasuk += nom;
          if (isCurrentMonth) bulanIniMasuk += nom;
        } else {
          totalKeluar += nom;
          if (isCurrentMonth) bulanIniKeluar += nom;
        }
      });

      const saldoKas = totalMasuk - totalKeluar;
      const totalArus = totalMasuk + totalKeluar;
      const persenMasuk = totalArus > 0 ? Math.round((totalMasuk / totalArus) * 100) : 100;

      // Aktivitas 7 hari terakhir untuk grafik kapsul
      const days = [];
      const dayLabels = ['M', 'S', 'S', 'R', 'K', 'J', 'S'];
      for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const iso = d.toISOString().split('T')[0];
        const dayTotal = state.transactions
          .filter(t => t.tanggal === iso)
          .reduce((acc, cur) => acc + (Number(cur.nominal) || 0), 0);
        days.push({
          date: iso,
          label: dayLabels[d.getDay()],
          total: dayTotal
        });
      }
      const maxDayTotal = Math.max(...days.map(d => d.total), 1);

      return {
        saldoKas,
        totalMasuk,
        totalKeluar,
        bulanIniMasuk,
        bulanIniKeluar,
        totalCount: state.transactions.length,
        persenMasuk,
        days,
        maxDayTotal
      };
    }

    function getFilteredReportTransactions() {
      const sorted = [...state.transactions].sort((a, b) => (a.tanggal || '').localeCompare(b.tanggal || ''));
      if (state.laporanMode === 'keseluruhan') return sorted;
      return sorted.filter(t => {
        if (state.laporanStartDate && t.tanggal < state.laporanStartDate) return false;
        if (state.laporanEndDate && t.tanggal > state.laporanEndDate) return false;
        return true;
      });
    }

    // =========================================================================
    // 10. EKSPOR EXCEL & PDF RESMI
    // =========================================================================
    function exportReportToExcel() {
      if (typeof XLSX === 'undefined') {
        showToast('Library Excel belum termuat.', 'error');
        return;
      }
      const list = getFilteredReportTransactions();
      let saldo = 0;
      const rows = list.map((t, idx) => {
        const masuk = t.jenis === 'pemasukan' ? Number(t.nominal) : 0;
        const keluar = t.jenis === 'pengeluaran' ? Number(t.nominal) : 0;
        saldo += (masuk - keluar);
        return {
          'No': idx + 1,
          'Tanggal': t.tanggal,
          'Kategori': t.kategori_nama,
          'Uraian Transaksi': t.keterangan,
          'Pemasukan (Rp)': masuk,
          'Pengeluaran (Rp)': keluar,
          'Saldo Berjalan (Rp)': saldo,
          'Dicatat Oleh': t.dibuat_oleh || '-'
        };
      });

      const ws = XLSX.utils.json_to_sheet(rows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Laporan Keuangan Masjid');
      XLSX.writeFile(wb, `Laporan_Keuangan_${state.settings.nama_masjid.replace(/\s+/g, '_')}.xlsx`);
      showToast('File Excel laporan berhasil diunduh.');
    }

    function exportReportToPDF() {
      const el = document.getElementById('printable-report-area');
      if (!el) return;
      if (typeof html2pdf === 'undefined') {
        window.print();
        return;
      }
      showToast('Menyiapkan dokumen PDF resmi...', 'info');
      const opt = {
        margin: [10, 10, 10, 10],
        filename: `Laporan_Resmi_${state.settings.nama_masjid.replace(/\s+/g, '_')}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };
      html2pdf().set(opt).from(el).save().then(() => {
        showToast('Dokumen PDF berhasil diunduh.');
      });
    }

    // =========================================================================
    // 11. BACKUP, RESTORE, & RESET TOTAL DATABASE
    // =========================================================================
    function handleBackupJSON() {
      const payload = {
        app: 'SIMASJID',
        exported_at: new Date().toISOString(),
        settings: state.settings,
        users: state.users,
        categories: state.categories,
        transactions: state.transactions
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Backup_SIMASJID_${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Backup JSON berhasil diunduh.');
    }

    async function handleRestoreJSON(file) {
      if (!file) return;
      try {
        const text = await file.text();
        const data = JSON.parse(text);
        if (!data || !Array.isArray(data.transactions)) {
          showToast('Format file backup tidak valid.', 'error');
          return;
        }

        if (IS_PREVIEW) {
          if (data.settings) state.settings = { ...state.settings, ...data.settings };
          if (Array.isArray(data.users)) state.users = data.users;
          if (Array.isArray(data.categories)) state.categories = data.categories;
          if (Array.isArray(data.transactions)) state.transactions = data.transactions;
          showToast('Data berhasil dipulihkan (Mode Preview).');
          renderApp();
          return;
        }

        showToast('Memulihkan data ke Firebase Firestore...', 'info');
        if (data.settings) {
          await setDoc(doc(fbDb, 'masjid_settings', 'profil_utama'), data.settings, { merge: true });
        }
        const batch = writeBatch(fbDb);
        (data.users || []).forEach(u => {
          const ref = u.id ? doc(fbDb, 'masjid_users', u.id) : doc(collection(fbDb, 'masjid_users'));
          batch.set(ref, u);
        });
        (data.categories || []).forEach(c => {
          const ref = c.id ? doc(fbDb, 'masjid_categories', c.id) : doc(collection(fbDb, 'masjid_categories'));
          batch.set(ref, c);
        });
        (data.transactions || []).forEach(t => {
          const ref = t.id ? doc(fbDb, 'masjid_transactions', t.id) : doc(collection(fbDb, 'masjid_transactions'));
          batch.set(ref, t);
        });
        await batch.commit();
        showToast('Seluruh data backup berhasil dipulihkan ke database.');
      } catch (err) {
        showToast('Gagal memulihkan file backup: ' + err.message, 'error');
      }
    }

    async function handleResetAllData() {
      if (IS_PREVIEW) {
        state.transactions = [];
        state.categories = [];
        state.users = [];
        closeModal();
        showToast('Seluruh data berhasil dikosongkan.');
        renderApp();
        return;
      }
      try {
        showToast('Menghapus seluruh koleksi data di database...', 'info');
        const cols = ['masjid_transactions', 'masjid_categories', 'masjid_users'];
        for (const colName of cols) {
          const snap = await getDocs(collection(fbDb, colName));
          const batch = writeBatch(fbDb);
          snap.docs.forEach(d => batch.delete(d.ref));
          await batch.commit();
        }
        closeModal();
        showToast('Reset selesai. Seluruh data database telah dikosongkan.');
      } catch (err) {
        showToast('Gagal melakukan reset data: ' + err.message, 'error');
      }
    }

              <h3 class="text-base font-bold text-gray-900">Transaksi Keuangan Terbaru</h3>

    function renderKeuanganTab() {
      const perms = getPermissions(state.currentUser.role);

      // Filter transaksi berdasarkan tipe, kategori, dan searchQuery
      const filtered = state.transactions.filter(t => {
        if (state.keuanganFilterType !== 'semua' && t.jenis !== state.keuanganFilterType) return false;
        if (state.keuanganFilterCategory !== 'semua' && t.kategori_id !== state.keuanganFilterCategory) return false;
        if (state.searchQuery) {
          const q = state.searchQuery.toLowerCase();
          const matchKet = (t.keterangan || '').toLowerCase().includes(q);
          const matchKat = (t.kategori_nama || '').toLowerCase().includes(q);
          if (!matchKet && !matchKat) return false;
        }
        return true;
      });

      return `
        <!-- Header Halaman -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
          <div>
            <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-gray-900">Buku Kas & Transaksi</h1>
            <p class="text-xs sm:text-sm text-gray-500 mt-1">Catat pemasukan & pengeluaran lengkap dengan bukti foto kamera/galeri.</p>

          <div class="flex flex-wrap items-center gap-2.5">
            ${perms.canManageFinance ? `
              <button type="button" onclick="window.appActions.openModalKategori()"

                <i data-lucide="tags" class="w-4 h-4 text-brand-500"></i>
                <span>Kelola Kategori</span>
              </button>
              <button type="button" onclick="window.appActions.openModalTransaksi()"
                class="px-5 py-2.5 bg-brand-500 hover:bg-brand-600 text-white text-xs sm:text-sm font-bold rounded-full shadow-brand transition-all flex items-center gap-2">
                <i data-lucide="plus" class="w-4 h-4"></i>
                <span>Tambah Transaksi</span>
              </button>
            ` : `
              <span class="px-3.5 py-2 rounded-full bg-amber-50 text-amber-700 text-xs font-semibold border border-amber-200">
                Mode Pantau (${getRoleLabel(state.currentUser.role)})
              </span>
            `}
          </div>
        </div>

        <!-- Bar Filter & Pencarian -->
        <div class="bg-white rounded-3xl p-4 sm:p-5 border border-gray-100 shadow-soft mb-6 flex flex-col md:flex-row items-stretch md:items-center justify-between gap-3">
          <div class="flex items-center gap-1.5 bg-canvas p-1 rounded-2xl border border-gray-100 overflow-x-auto">
            ${[
              { id: 'semua', label: 'Semua' },
              { id: 'pemasukan', label: 'Pemasukan' },
              { id: 'pengeluaran', label: 'Pengeluaran' }
            ].map(tab => `
              <button type="button" onclick="window.appActions.setKeuanganType('${tab.id}')"
                class="px-4 py-2 rounded-xl text-xs font-bold transition-all whitespace-nowrap ${state.keuanganFilterType === tab.id ? 'bg-white text-brand-600 shadow-sm' : 'text-gray-500 hover:text-gray-800'}">
                ${tab.label}
              </button>
            `).join('')}
          </div>

          <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2.5">
            <select onchange="window.appActions.setKeuanganCategory(this.value)"
              class="px-3.5 py-2.5 bg-canvas border border-gray-200 rounded-2xl text-xs font-semibold text-gray-700 focus:outline-none focus:border-brand-500">
              <option value="semua">Semua Kategori</option>
              ${state.categories.map(c => `
                <option value="${c.id}" ${state.keuanganFilterCategory === c.id ? 'selected' : ''}>${c.nama_kategori} (${c.jenis === 'pemasukan' ? 'Masuk' : 'Keluar'})</option>
              `).join('')}
            </select>
          </div>
        </div>

        <!-- Daftar Transaksi -->
        <div class="bg-white rounded-3xl border border-gray-100 shadow-soft overflow-hidden">
          ${filtered.length === 0 ? `
            <div class="p-12 text-center">
              <div class="w-14 h-14 rounded-2xl bg-canvas text-gray-400 flex items-center justify-center mx-auto mb-3">
                <i data-lucide="folder-open" class="w-7 h-7"></i>
              </div>
              <h3 class="text-base font-bold text-gray-900">Belum Ada Data Transaksi</h3>
              <p class="text-xs text-gray-500 mt-1 max-w-sm mx-auto">Silakan catat pemasukan atau pengeluaran baru menggunakan tombol di atas.</p>
            </div>
          ` : `
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="border-b border-gray-100 text-[11px] font-bold uppercase tracking-wider text-gray-400 bg-canvas/60">
                    <th class="py-3.5 px-5">Tanggal & Kategori</th>
                    <th class="py-3.5 px-4">Keterangan</th>
                    <th class="py-3.5 px-4">Bukti Foto</th>
                    <th class="py-3.5 px-4 text-right">Nominal</th>
                    <th class="py-3.5 px-5 text-right">Aksi</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-gray-100 text-sm">
                  ${filtered.map(t => {
                    const isMasuk = t.jenis === 'pemasukan';
                    return `
                      <tr class="hover:bg-canvas/50 transition-colors">
                        <td class="py-4 px-5 whitespace-nowrap">
                          <div class="font-bold text-gray-900 text-xs">${formatTanggal(t.tanggal)}</div>
                          <span class="inline-block mt-1 px-2.5 py-0.5 rounded-full text-[11px] font-semibold ${isMasuk ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-50 text-rose-700'}">
                            ${t.kategori_nama}

                        <td class="py-4 px-4 min-w-[200px]">
                          <p class="font-semibold text-gray-800 text-xs sm:text-sm">${t.keterangan}</p>
                          <p class="text-[11px] text-gray-400 mt-0.5">Oleh: ${t.dibuat_oleh || 'Pengurus'}</p>

                        <td class="py-4 px-4 whitespace-nowrap">
                          ${t.bukti_foto ? `
                            <button type="button" onclick="window.appActions.previewBuktiFoto('${t.id}')"
                              class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-brand-50 text-brand-600 hover:bg-brand-100 text-xs font-bold transition-colors">
                              <i data-lucide="image" class="w-3.5 h-3.5"></i>
                              <span>Lihat Foto</span>
                            </button>
                          ` : `<span class="text-xs text-gray-400 italic">Tanpa foto</span>`}
                        </td>
                        <td class="py-4 px-4 text-right whitespace-nowrap font-extrabold tabular-nums ${isMasuk ? 'text-emerald-600' : 'text-rose-600'}">
                          ${isMasuk ? '+' : '-'} ${formatRupiah(t.nominal)}
                        </td>
                        <td class="py-4 px-5 text-right whitespace-nowrap">
                          ${perms.canManageFinance ? `
                            <div class="inline-flex items-center gap-1.5">

                              </button>
                            </div>
                          ` : `<span class="text-xs text-gray-400">-</span>`}
                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          `}
        </div>
      `;
    }

    function renderLaporanTab() {
      const list = getFilteredReportTransactions();
      const perms = getPermissions(state.currentUser.role);
      const showSign = Boolean(state.showSignaturesInPDF);

      let totalMasuk = 0;
      let totalKeluar = 0;
      list.forEach(t => {
        if (t.jenis === 'pemasukan') totalMasuk += Number(t.nominal) || 0;
        else totalKeluar += Number(t.nominal) || 0;
      });
      const selisihPeriode = totalMasuk - totalKeluar;

      let runningBalance = 0;

      return `
        <!-- Header Halaman -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
          <div>
            <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-gray-900">Laporan Keuangan Resmi</h1>
            <p class="text-xs sm:text-sm text-gray-500 mt-1">Filter berdasarkan tanggal atau keseluruhan, siap unduh Excel & PDF bertanda tangan DKM.</p>
          </div>
          <div class="flex flex-wrap items-center gap-2.5">
            <label class="inline-flex items-center gap-2 px-3.5 py-2 bg-white border border-gray-200 rounded-full cursor-pointer select-none shadow-soft">
              <input type="checkbox" ${showSign ? 'checked' : ''} onchange="window.appActions.toggleSignaturesPDF(this.checked)"
                class="w-4 h-4 accent-brand-500 rounded cursor-pointer" />
              <span class="text-xs font-bold text-gray-700">Tampilkan TTD Pejabat</span>
            </label>
            <button type="button" onclick="window.appActions.exportExcel()"
              class="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm font-bold rounded-full shadow-sm transition-all flex items-center gap-2">
              <i data-lucide="file-spreadsheet" class="w-4 h-4"></i>
              <span>Unduh Excel</span>
            </button>
            <button type="button" onclick="window.appActions.exportPDF()"
              class="px-5 py-2.5 bg-brand-500 hover:bg-brand-600 text-white text-xs sm:text-sm font-bold rounded-full shadow-brand transition-all flex items-center gap-2">
              <i data-lucide="file-text" class="w-4 h-4"></i>
              <span>Unduh PDF Resmi</span>
            </button>
          </div>
        </div>

        <!-- Panel Filter Periode Laporan -->
        <div class="bg-white rounded-3xl p-5 border border-gray-100 shadow-soft mb-6 flex flex-col lg:flex-row lg:items-center justify-between gap-4">
          <div class="flex items-center gap-2 bg-canvas p-1.5 rounded-2xl border border-gray-100 w-fit">
            <button type="button" onclick="window.appActions.setLaporanMode('rentang')"
              class="px-4 py-2 rounded-xl text-xs font-bold transition-all ${state.laporanMode === 'rentang' ? 'bg-white text-brand-600 shadow-sm' : 'text-gray-500'}">
              Berdasarkan Tanggal
            </button>
            <button type="button" onclick="window.appActions.setLaporanMode('keseluruhan')"
              class="px-4 py-2 rounded-xl text-xs font-bold transition-all ${state.laporanMode === 'keseluruhan' ? 'bg-white text-brand-600 shadow-sm' : 'text-gray-500'}">
              Keseluruhan Data
            </button>
          </div>

          ${state.laporanMode === 'rentang' ? `
            <div class="flex flex-wrap items-center gap-3">
              <div class="flex items-center gap-2">
                <label class="text-xs font-semibold text-gray-500">Dari:</label>
                <input type="date" value="${state.laporanStartDate}" onchange="window.appActions.setLaporanDates('start', this.value)"
                  class="px-3.5 py-2 bg-canvas border border-gray-200 rounded-xl text-xs font-bold text-gray-800" />
              </div>
              <div class="flex items-center gap-2">
                <label class="text-xs font-semibold text-gray-500">Sampai:</label>
                <input type="date" value="${state.laporanEndDate}" onchange="window.appActions.setLaporanDates('end', this.value)"
                  class="px-3.5 py-2 bg-canvas border border-gray-200 rounded-xl text-xs font-bold text-gray-800" />
              </div>
            </div>
          ` : `
            <span class="text-xs font-semibold text-brand-600 bg-brand-50 px-3.5 py-2 rounded-xl">
              Menampilkan seluruh riwayat transaksi dari awal pencatatan
            </span>
          `}
        </div>

        <!-- Area Dokumen Laporan Resmi (Target Ekspor PDF) -->
        <div id="printable-report-area" class="bg-white rounded-3xl p-6 sm:p-10 border border-gray-100 shadow-soft">
          <!-- Kop Surat Resmi Masjid -->
          <div class="border-b-2 border-gray-900 pb-5 mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div class="flex items-center gap-4">
              <div class="w-14 h-14 rounded-2xl bg-brand-500 text-white flex items-center justify-center shrink-0">
                <i data-lucide="landmark" class="w-8 h-8"></i>
              </div>
              <div>
                <p class="text-[11px] font-bold uppercase tracking-widest text-brand-600">Dewan Kemakmuran Masjid (DKM)</p>
                <h2 class="text-xl sm:text-2xl font-extrabold text-gray-900 uppercase">${state.settings.nama_masjid}</h2>
                <p class="text-xs text-gray-600 mt-0.5">${state.settings.alamat_masjid}</p>
              </div>
            </div>
            <div class="sm:text-right">
              <span class="inline-block px-3 py-1 rounded-lg bg-gray-900 text-white text-xs font-bold uppercase tracking-wider">
                Laporan Kas Keuangan
              </span>
              <p class="text-xs font-semibold text-gray-600 mt-1.5">
                Periode: ${state.laporanMode === 'keseluruhan' ? 'Keseluruhan Waktu' : `${formatTanggal(state.laporanStartDate)} s/d ${formatTanggal(state.laporanEndDate)}`}

            <div class="p-4 rounded-2xl bg-rose-50/70 border border-rose-100">

              <p class="text-lg sm:text-xl font-extrabold text-rose-800 tabular-nums mt-1">${formatRupiah(totalKeluar)}</p>

            <div class="p-4 rounded-2xl bg-brand-50 border border-brand-100">
              <span class="text-xs font-semibold text-brand-700">Surplus / Saldo Akhir Periode</span>
              <p class="text-lg sm:text-xl font-extrabold text-brand-800 tabular-nums mt-1">${formatRupiah(selisihPeriode)}</p>
            </div>
          </div>

          <!-- Tabel Rincian Laporan -->

              <tbody class="divide-y divide-gray-200 border-b border-gray-300">

                  <tr>
                    <td colspan="7" class="py-8 text-center text-gray-400">Tidak ada data transaksi pada rentang laporan ini.</td>

                ` : list.map((t, idx) => {
                  const masuk = t.jenis === 'pemasukan' ? Number(t.nominal) : 0;
                  const keluar = t.jenis === 'pengeluaran' ? Number(t.nominal) : 0;

                      <td class="py-2.5 px-3 font-medium text-gray-600">${idx + 1}</td>
                      <td class="py-2.5 px-3 whitespace-nowrap font-semibold text-gray-800">${formatTanggal(t.tanggal)}</td>
                      <td class="py-2.5 px-3 font-medium text-gray-700">${t.kategori_nama}</td>
                      <td class="py-2.5 px-3 text-gray-800">${t.keterangan}</td>
                      <td class="py-2.5 px-3 text-right tabular-nums font-semibold text-emerald-700 whitespace-nowrap">${masuk > 0 ? formatRupiah(masuk) : '-'}</td>
                      <td class="py-2.5 px-3 text-right tabular-nums font-semibold text-rose-700 whitespace-nowrap">${keluar > 0 ? formatRupiah(keluar) : '-'}</td>
                      <td class="py-2.5 px-3 text-right tabular-nums font-bold text-gray-900 whitespace-nowrap">${formatRupiah(runningBalance)}</td>

          <div class="pt-3 flex items-center justify-between text-[11px] text-gray-500">

                <div>
                  <p class="text-[11px] text-gray-500">Mengetahui,</p>
                  <p class="font-bold text-gray-900">Ketua DKM</p>
                </div>
                <div class="pt-10">
                  <p class="font-extrabold underline">${state.settings.nama_ketua || '..............................'}</p>
                </div>
              </div>
              <div class="flex flex-col justify-between min-h-[105px]">
                <div>
                  <p class="text-[11px] text-gray-500">Diperiksa Oleh,</p>
                  <p class="font-bold text-gray-900">Sekretaris DKM</p>

      return filtered.map(c => `
        <option value="${c.id}" ${c.id === selectedId ? 'selected' : ''}>${c.nama_kategori}</option>
      `).join('');

      }

      const menuItems = [
        { id: 'dashboard', label: 'Dashboard', icon: 'layout-grid', section: 'MENU UTAMA' },
        { id: 'keuangan', label: 'Keuangan', icon: 'wallet', section: 'MENU UTAMA' },
        { id: 'laporan', label: 'Laporan', icon: 'file-bar-chart-2', section: 'MENU UTAMA' },
        { id: 'pengguna', label: 'Pengurus', icon: 'users', section: 'ADMINISTRASI' },
        { id: 'pengaturan', label: 'Pengaturan', icon: 'settings', section: 'ADMINISTRASI' }
      ];

      let activeContent = '';
      if (state.activeTab === 'dashboard') activeContent = renderDashboardTab();
      else if (state.activeTab === 'keuangan') activeContent = renderKeuanganTab();
      else if (state.activeTab === 'laporan') activeContent = renderLaporanTab();
      else if (state.activeTab === 'pengguna') activeContent = renderPenggunaTab();
      else if (state.activeTab === 'pengaturan') activeContent = renderPengaturanTab();

      root.innerHTML = `
        <div class="min-h-screen flex bg-canvas">
          <!-- DESKTOP FIXED SIDEBAR (Sembunyi di Mobile, Tampil di lg ke atas) -->
          <aside class="hidden lg:flex flex-col w-64 bg-white border-r border-gray-100 fixed inset-y-0 left-0 z-30 justify-between py-6">
            <div>
              <!-- Logo Brand -->
              <div class="px-6 mb-8 flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-brand-500 text-white flex items-center justify-center shadow-brand">
                  <i data-lucide="landmark" class="w-5 h-5"></i>
                </div>
                <div>
                  <span class="text-lg font-extrabold tracking-tight text-gray-900 block leading-none">SIMASJID</span>
                  <span class="text-[11px] font-semibold text-gray-400 mt-1 block truncate max-w-[140px]">${state.settings.nama_masjid}</span>
                </div>
              </div>

              <!-- Menu Navigasi -->
              <div class="space-y-6">
                <div>
                  <p class="px-6 text-[10px] font-bold uppercase tracking-widest text-gray-400 mb-2">Menu Utama</p>
                  <nav class="space-y-1">
                    ${menuItems.filter(m => m.section === 'MENU UTAMA').map(item => `
                      <button type="button" onclick="window.appActions.switchTab('${item.id}')"
                        class="nav-item-desktop w-full flex items-center gap-3.5 px-6 py-3 text-sm font-medium text-gray-500 hover:text-gray-900 ${state.activeTab === item.id ? 'active' : ''}">
                        <i data-lucide="${item.icon}" class="w-5 h-5"></i>
                        <span>${item.label}</span>
                      </button>
                    `).join('')}
                  </nav>
                </div>

                <div>
                  <p class="px-6 text-[10px] font-bold uppercase tracking-widest text-gray-400 mb-2">Administrasi</p>
                  <nav class="space-y-1">
                    ${menuItems.filter(m => m.section === 'ADMINISTRASI').map(item => `
                      <button type="button" onclick="window.appActions.switchTab('${item.id}')"
                        class="nav-item-desktop w-full flex items-center gap-3.5 px-6 py-3 text-sm font-medium text-gray-500 hover:text-gray-900 ${state.activeTab === item.id ? 'active' : ''}">
                        <i data-lucide="${item.icon}" class="w-5 h-5"></i>
                        <span>${item.label}</span>
                      </button>
                    `).join('')}
                    <button type="button" onclick="window.appActions.logout()"
                      class="w-full flex items-center gap-3.5 px-6 py-3 text-sm font-medium text-rose-500 hover:bg-rose-50/70 transition-colors">
                      <i data-lucide="log-out" class="w-5 h-5"></i>
                      <span>Keluar</span>
                    </button>
                  </nav>
                </div>
              </div>
            </div>

            <!-- Kartu Status Mode di Bawah Sidebar -->
            <div class="px-5">
              <div class="rounded-3xl bg-gradient-to-br from-gray-900 to-brand-700 text-white p-4 relative overflow-hidden">
                <span class="inline-block px-2 py-0.5 rounded-md bg-white/15 text-[10px] font-bold uppercase tracking-wider mb-1.5">
                  ${IS_PREVIEW ? 'Mode Preview' : 'Live Firebase'}
                </span>
                <p class="text-xs font-bold leading-snug">${state.settings.nama_masjid}</p>
                <p class="text-[11px] text-white/75 mt-0.5">Transparansi Kas Umat</p>
              </div>
            </div>
          </aside>

          <!-- AREA KONTEN UTAMA -->
          <div class="flex-1 lg:pl-64 flex flex-col min-w-0 pb-32 lg:pb-10">
            <!-- Top Header Bar (Search + Profil User) -->
            <header class="sticky top-0 z-20 bg-canvas/90 backdrop-blur-md px-4 sm:px-8 py-4">
              <div class="max-w-7xl mx-auto bg-white rounded-3xl px-4 sm:px-6 py-3 border border-gray-100 shadow-soft flex items-center justify-between gap-4">
                <!-- Logo Mobile + Search Input -->
                <div class="flex items-center gap-3 flex-1 max-w-md">
                  <div class="lg:hidden w-9 h-9 rounded-xl bg-brand-500 text-white flex items-center justify-center shrink-0">
                    <i data-lucide="landmark" class="w-5 h-5"></i>
                  </div>
                  <div class="relative flex-1">
                    <i data-lucide="search" class="w-4 h-4 text-gray-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                    <input type="text" value="${state.searchQuery}" oninput="window.appActions.setSearch(this.value)"
                      placeholder="Cari transaksi atau kategori..."
                      class="w-full pl-10 pr-4 py-2 bg-canvas rounded-full text-xs sm:text-sm text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500/20" />
                  </div>
                </div>

                <!-- Badge Preview & Profil Pengguna -->
                <div class="flex items-center gap-3">
                  ${IS_PREVIEW ? `
                    <span class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-brand-50 text-brand-600 text-xs font-bold">
                      <span class="w-2 h-2 rounded-full bg-brand-500 animate-pulse"></span>
                      Preview Mode
                    </span>
                  ` : ''}

                  <div class="flex items-center gap-2.5 pl-2 border-l border-gray-100">
                    ${state.currentUser.foto_profil
                      ? `<img src="${state.currentUser.foto_profil}" class="w-9 h-9 rounded-full object-cover border border-gray-200" />`
                      : `<div class="w-9 h-9 rounded-full bg-brand-100 text-brand-600 font-extrabold text-sm flex items-center justify-center">${(state.currentUser.nama || 'A').charAt(0).toUpperCase()}</div>`
                    }
                    <div class="hidden sm:block text-left">
                      <p class="text-xs font-extrabold text-gray-900 leading-tight">${state.currentUser.nama}</p>
                      <p class="text-[11px] font-medium text-gray-400">${getRoleLabel(state.currentUser.role)}</p>
                    </div>
                    <button type="button" onclick="window.appActions.logout()" title="Keluar"
                      class="lg:hidden p-2 rounded-full text-rose-500 hover:bg-rose-50">
                      <i data-lucide="log-out" class="w-4 h-4"></i>
                    </button>
                  </div>
                </div>
              </div>
            </header>

            <!-- Kontainer Konten Dinamis -->
            <main class="flex-1 px-4 sm:px-8 pt-2">
              <div class="max-w-7xl mx-auto">
                ${activeContent}
              </div>
            </main>
          </div>

          <!-- MOBILE FLOATING BOTTOM NAVIGATION BAR (Tampil di HP, Sembunyi di Desktop) -->
          <nav class="lg:hidden fixed bottom-3 inset-x-2.5 sm:inset-x-4 z-40 glass-nav rounded-3xl shadow-xl px-1.5 py-1.5 grid grid-cols-5 gap-1 items-center" style="padding-bottom: max(0.375rem, env(safe-area-inset-bottom));">
            ${menuItems.map(item => {
              const isActive = state.activeTab === item.id;
              return `
                <button type="button" onclick="window.appActions.switchTab('${item.id}')"
                  class="flex flex-col items-center justify-center py-2 px-1 rounded-2xl transition-all min-w-0 ${isActive ? 'bg-brand-500 text-white shadow-brand' : 'text-gray-500 hover:text-gray-900'}">
                  <i data-lucide="${item.icon}" class="w-4 h-4 shrink-0"></i>
                  <span class="text-[10px] font-bold mt-1 truncate max-w-full leading-none">${item.label}</span>
                </button>
              `;
            }).join('')}
          </nav>
        </div>
      `;

      bindTabEvents();
      if (window.lucide) lucide.createIcons();
    }

    // =========================================================================
    // 18. EVENT BINDERS
    // =========================================================================
    function bindLoginEvents() {
      const formLogin = document.getElementById('form-unified-login');
      if (!formLogin) return;

      formLogin.addEventListener('submit', (e) => {
        e.preventDefault();
        const identifier = document.getElementById('input-login-identifier').value;
        const pass = document.getElementById('input-login-password').value;
        handleUnifiedLogin(identifier, pass);
      });
    }

    function bindTabEvents() {
      const formSettings = document.getElementById('form-settings-masjid');
      if (formSettings) {
        formSettings.addEventListener('submit', (e) => {
          e.preventDefault();
          saveSettings({
            nama_masjid: document.getElementById('set-nama-masjid').value.trim(),
            alamat_masjid: document.getElementById('set-alamat-masjid').value.trim(),
            kota_masjid: document.getElementById('set-kota-masjid').value.trim(),
            nama_ketua: document.getElementById('set-nama-ketua')?.value.trim() || '',
            nama_sekretaris: document.getElementById('set-nama-sekretaris')?.value.trim() || '',
            nama_bendahara: document.getElementById('set-nama-bendahara')?.value.trim() || ''
          });
        });
      }
    }

    // Inisialisasi Awal
    renderApp();
  </script>
</body>
</html>
